groups:
  - name: api_alerts
    rules:
      - alert: ApiDown
        expr: up{job="api"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "API instance is down"
      - alert: HighErrorRate
        expr: sum(rate(api_error_total[1m])) > 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High API error rate detected"
      - alert: DatabaseUnhealthy
        expr: min(db_health_status) == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Database health check failing"
      - alert: HighLatency
        expr: histogram_quantile(0.95, sum(rate(api_request_latency_seconds_bucket[2m])) by (le)) > 0.5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "API latency is high"