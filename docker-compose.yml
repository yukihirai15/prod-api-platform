
services:
  api:
    build: .
    ports:
      - "8000"
    environment:
      DB_HOST: db
      DB_NAME: appdb
      DB_USER: appuser
      DB_PASSWORD: secret
    depends_on:
      - db
    env_file:
      - .env

  
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 2s
      retries: 3

    restart: always

  nginx:
    image: nginx:alpine
    ports:
     - "8000:80"
     - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx_status.conf:/etc/nginx/nginx_status.conf:ro
      - /nginx-logs:/var/log/nginx

    depends_on:
      - api

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data

    env_file:
      - .env


  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:0.11.0
    command:
      - "-nginx.scrape-uri=http://nginx:8080/nginx_status"
    depends_on:
      - nginx
    ports:
      - "9113:9113"

  prometheus: ##Do NOT expose this publicly in real life — fine for local demo. ##
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml
    ports:
      - "9090:9090"
    depends_on:
      - api
      - nginx-exporter

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin

  alertmanager:
    image: prom/alertmanager
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml
    networks:
      - default


volumes:
  postgres_data:



 